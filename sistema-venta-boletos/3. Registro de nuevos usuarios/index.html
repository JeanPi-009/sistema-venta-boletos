<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');
</style>

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - TicketSports</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="registro-container">

        <h1>TicketSports</h1>
        <h2>Crear Cuenta</h2>

        <form id="form-registro">
            <input type="text" id="nombre" placeholder="Nombre completo" required>
            <span id="errorNombre" class="mensaje-error" style="color:red; font-size: 12px;"></span>
            <input type="email" id="correo" placeholder="Correo electrónico" required>
            <span id="errorCorreo" class="mensaje-error" style="color:red; font-size: 12px;"></span>
            <input type="password" id="password" placeholder="Contraseña" required>
            <span id="errorPassword" class="mensaje-error" style="color:red; font-size: 12px;"></span>

            <button type="submit">Registrarse</button>
        </form>

        <p id="mensaje"></p>

        <a href="../2. Acceso de usuarios/index.html" class="volver">← Volver al login</a>

    </div>

    <script src="script.js"></script>
</body>
</html>
