<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmación de Compra - TicketSports</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="contenedor">

        <h1>Confirmar Compra</h1>

        <p class="descripcion">
            Verifica que la información ingresada sea correcta antes de finalizar la compra.
        </p>

    <div class="resumen">

        <h3>Resumen de la compra</h3>

        <p>
            <strong>Nombre:</strong>
            <span id="nombreResumen"></span>
        </p>

        <p>
            <strong>Cédula:</strong>
            <span id="cedulaResumen"></span>
        </p>

        <p>
            <strong>Correo:</strong>
            <span id="correoResumen"></span>
        </p>

        <p>
            <strong>Método de Pago:</strong>
            <span id="pagoResumen"></span>
        </p>

    </div>

        <div class="botones">

            <button id="cancelar">
                Cancelar
            </button>

            <button id="confirmar">
                Confirmar Compra
            </button>

        </div>

    </div>

    <!-- Ventana de éxito -->

    <div id="modalExito" class="modal">

        <div class="modal-content">

            <h2>✅ Compra realizada con éxito</h2>

            <p>
                Gracias por utilizar TicketSports.
            </p>

            <button id="cerrarModal">
                Aceptar
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
